<html>
  <head>
    <meta charset="utf-8">
    <title>36 Points — Sage Jenson</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      canvas {
        image-rendering: smooth;
        position: absolute;
        overflow: hidden;
      }

      body {
        cursor: none;
        margin: 0;
        padding: 0;
        background-color: black;
        overflow: hidden;
        max-height: 100vh;
      }

      #temp-box {
        position: absolute;
        top: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.4); /* semi-transparent black */
        color: #00FF00; /* lime green */
        font-family: sans-serif;
        font-size: 1.5em;
        padding: 0.3em 0.6em;
        pointer-events: none; /* make it non-interactive */
        z-index: 9999;
      }
    </style>
    <script>
      async function fetchTemp() {
        try {
          const res = await fetch('http://localhost:8000/temp');
          const data = await res.json();
          document.getElementById('temp').textContent = `${data.temp} °C`;
        } catch {
          document.getElementById('temp').textContent = 'Error';
        }
      }

      setInterval(fetchTemp, 5000);
      window.onload = fetchTemp;
    </script>
  </head>

  <body ondrop="drop(event)" ondragover="allowDrop(event)">
    <canvas id="canvas">Enable JavaScript in your browser</canvas>
    <div id="temp-box">CPU Temp: <span id="temp">Loading...</span></div>
    <script type="text/javascript" src="main.js"></script>
  </body>
</html>
